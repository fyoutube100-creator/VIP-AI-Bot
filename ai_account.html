<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Trading Account - Black Shoter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #fff; }
        .neon-blue { box-shadow: 0 0 15px rgba(0, 198, 255, 0.4); border: 1px solid rgba(0, 198, 255, 0.6); }
        .neon-green { box-shadow: 0 0 15px rgba(0, 255, 135, 0.4); border: 1px solid rgba(0, 255, 135, 0.6); }
        .neon-purple { box-shadow: 0 0 15px rgba(188, 0, 255, 0.4); border: 1px solid rgba(188, 0, 255, 0.6); }
        .neon-gold { box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); border: 1px solid rgba(255, 215, 0, 0.6); }
        .bg-grad-blue { background: linear-gradient(135deg, #001f3f 0%, #0052d4 100%); }
        .bg-grad-green { background: linear-gradient(135deg, #004d00 0%, #00b09b 100%); }
        .bg-grad-purple { background: linear-gradient(135deg, #2d004d 0%, #8e2de2 100%); }
        .bg-grad-gold { background: linear-gradient(135deg, #4d3600 0%, #cac531 100%); }
        .bg-nav-active { background: linear-gradient(90deg, rgba(0,198,255,0) 0%, rgba(0,198,255,0.4) 50%, rgba(0,198,255,0) 100%); border-bottom: 2px solid #00c6ff; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">
    
    <script>
        // ইউজারনেম সেভ করে রাখা হচ্ছে যাতে যার যার নিজের ডাটা পায়
        if (!localStorage.getItem('username')) {
            let user = prompt("Please confirm your Username to load your Dashboard:");
            if(user) localStorage.setItem('username', user);
        }
    </script>

    <header class="flex justify-between items-center px-4 py-3 bg-[#020617] border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="text-3xl text-[#00c6ff]"><i class="fa-solid fa-chart-line"></i></div>
            <div>
                <h1 class="text-xl font-black tracking-tight leading-tight">Black Shoter <span class="text-[#00c6ff] italic">FOREX</span></h1>
                <p class="text-[10px] text-gray-400 italic">Trade Smart • Earn More • Grow Together</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button class="flex items-center gap-2 bg-[#0f172a] border border-[#00c6ff] text-[#00c6ff] px-4 py-1.5 rounded-lg text-sm font-bold neon-blue">
                <i class="fa-solid fa-wallet"></i> View Balance <i class="fa-solid fa-chevron-down text-xs"></i>
            </button>
            <button onclick="localStorage.removeItem('is_logged_in'); localStorage.removeItem('username'); window.location.href='/login.html'" class="flex items-center gap-2 border border-red-500 text-red-500 px-4 py-1.5 rounded-lg text-sm font-bold shadow-[0_0_10px_rgba(239,68,68,0.3)]">
                Logout <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <nav class="flex justify-around items-center bg-[#050b14] border-b border-gray-800 text-sm font-bold text-gray-400">
        <a href="/bot.html" class="py-3 px-6 hover:text-white transition flex gap-2 items-center"><i class="fa-solid fa-home"></i> Home</a>
        <a href="/bot.html" class="py-3 px-6 hover:text-white transition flex gap-2 items-center"><i class="fa-solid fa-tower-broadcast"></i> Signals</a>
        <a href="#" class="py-3 px-10 text-white bg-nav-active flex gap-2 items-center"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="https://t.me/Blackshoter10" class="py-3 px-6 hover:text-white transition flex gap-2 items-center"><i class="fa-solid fa-headset"></i> Support</a>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-4">
        
        <div class="bg-grad-blue rounded-xl p-6 neon-blue flex justify-between items-center relative overflow-hidden">
            <div class="absolute right-0 top-0 opacity-20 text-9xl"><i class="fa-solid fa-globe"></i></div>
            <div class="relative z-10 flex gap-4 items-center">
                <div class="text-5xl text-white"><i class="fa-solid fa-user-shield"></i></div>
                <div>
                    <p class="text-sm font-bold">Welcome Back,</p>
                    <h2 class="text-3xl font-black text-[#00c6ff]" id="user-display-name">Trader</h2>
                </div>
            </div>
            <div class="relative z-10 bg-green-500/20 border border-green-500 text-green-400 px-4 py-2 rounded-lg flex items-center gap-3 neon-green">
                <i class="fa-solid fa-circle-check text-2xl"></i>
                <div>
                    <h3 class="font-black text-sm">Account Active</h3>
                    <p class="text-[10px]">Trade & Earn with Confidence</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-2 bg-[#020617] rounded-xl p-5 neon-blue flex items-center gap-6">
                <div class="w-16 h-16 bg-[#00c6ff] rounded-2xl flex items-center justify-center text-3xl text-white shadow-[0_0_20px_#00c6ff]">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-300">Your Balance</p>
                    <h2 class="text-4xl font-black text-white" id="dyn-balance">$ 0.00</h2>
                </div>
            </div>
            
            <div class="flex flex-col gap-4">
                <button class="flex-1 bg-grad-green rounded-xl neon-green flex flex-col items-center justify-center py-4 text-white hover:opacity-90 transition">
                    <i class="fa-solid fa-download text-2xl mb-1"></i>
                    <span class="font-black text-lg">Deposit</span>
                </button>
                <button class="flex-1 bg-grad-purple rounded-xl neon-purple flex flex-col items-center justify-center py-4 text-white hover:opacity-90 transition">
                    <i class="fa-solid fa-arrow-up-from-bracket text-2xl mb-1"></i>
                    <span class="font-black text-lg">Withdraw</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-2 gap-4">
            <div class="bg-grad-blue rounded-xl p-5 neon-blue relative overflow-hidden flex items-center gap-4">
                <i class="fa-solid fa-chart-column absolute right-2 bottom-0 text-6xl text-white opacity-10"></i>
                <div class="text-4xl text-[#00c6ff]"><i class="fa-solid fa-calendar-days"></i></div>
                <div>
                    <p class="text-sm font-bold text-gray-200">Deposit</p>
                    <h3 class="text-3xl font-black text-white" id="dyn-deposit">$ 0.00</h3>
                </div>
            </div>
            <div class="bg-grad-green rounded-xl p-5 neon-green relative overflow-hidden flex justify-between items-center">
                <i class="fa-solid fa-chart-column absolute right-2 bottom-0 text-6xl text-white opacity-10"></i>
                <div class="flex items-center gap-4">
                    <div class="text-4xl text-[#00ff87]"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div>
                        <p class="text-sm font-bold text-gray-200">Daily Profit</p>
                        <h3 class="text-3xl font-black text-white" id="dyn-daily-profit">$ 0.00</h3>
                    </div>
                </div>
            </div>
            <div class="bg-grad-purple rounded-xl p-5 neon-purple relative overflow-hidden flex items-center gap-4">
                <i class="fa-solid fa-chart-column absolute right-2 bottom-0 text-6xl text-white opacity-10"></i>
                <div class="text-4xl text-[#d946ef]"><i class="fa-solid fa-right-left"></i></div>
                <div>
                    <p class="text-sm font-bold text-gray-200">Total Withdrawal</p>
                    <h3 class="text-3xl font-black text-white" id="dyn-withdraw">$ 0.00</h3>
                </div>
            </div>
            <div class="bg-grad-gold rounded-xl p-5 neon-gold relative overflow-hidden flex items-center gap-4">
                <i class="fa-solid fa-arrow-trend-up absolute right-2 bottom-2 text-6xl text-white opacity-10"></i>
                <div class="text-4xl text-[#facc15]"><i class="fa-solid fa-trophy"></i></div>
                <div>
                    <p class="text-sm font-bold text-gray-200">Total Profit</p>
                    <h3 class="text-3xl font-black text-white" id="dyn-total-profit">$ 0.00</h3>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 🚀 সার্ভার থেকে ইউজার স্পেসিফিক ডাটা ফেচ করার ফাংশন
        function fetchAccountData() {
            const username = localStorage.getItem('username');
            if(username) {
                document.getElementById('user-display-name').innerText = username;
                fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: username})
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById('dyn-balance').innerText = "$ " + parseFloat(data.data.balance).toFixed(2);
                        document.getElementById('dyn-deposit').innerText = "$ " + parseFloat(data.data.deposit).toFixed(2);
                        document.getElementById('dyn-daily-profit').innerText = "$ " + parseFloat(data.data.profit).toFixed(2);
                        document.getElementById('dyn-total-profit').innerText = "$ " + parseFloat(data.data.total_profit).toFixed(2);
                        document.getElementById('dyn-withdraw').innerText = "$ " + parseFloat(data.data.withdraw).toFixed(2);
                    }
                }).catch(err => console.error(err));
            }
        }
        
        // প্রতি ৫ সেকেন্ডে ডাটা আপডেট হবে
        setInterval(fetchAccountData, 5000);
        fetchAccountData();
    </script>
</body>
</html>
