<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Login - Black Shoter AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-white flex items-center justify-center min-h-screen">

    <div class="bg-[#161b22] border border-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
        <div class="flex justify-center mb-6">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg text-white flex items-center justify-center font-black italic text-2xl shadow-[0_0_15px_rgba(59,130,246,0.5)]">B</div>
        </div>
        <h2 class="text-2xl font-bold text-center mb-2">Black Shoter AI</h2>
        <p class="text-xs text-gray-400 text-center mb-8">Secure 2-Step Verification Login</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-400">Username</label>
                <input type="text" id="username" required class="w-full mt-1 bg-[#0d1117] border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 outline-none" placeholder="Enter VIP ID">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400">Password</label>
                <input type="password" id="password" required class="w-full mt-1 bg-[#0d1117] border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 outline-none" placeholder="Enter Password">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition mt-4 shadow-lg shadow-blue-500/20">Login to Dashboard</button>
        </form>

        <div id="msgBox" class="mt-4 text-center text-sm hidden font-bold p-3 rounded-lg border"></div>
    </div>

    <script>
        // 🔒 Device ID Generator (পারমানেন্ট ব্রাউজার মেমোরি)
        function getDeviceId() {
            let deviceId = localStorage.getItem('device_id');
            if (!deviceId) {
                deviceId = 'DEV-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
                localStorage.setItem('device_id', deviceId);
            }
            return deviceId;
        }

        // 📱 Device Name Identifier
        function getDeviceName() {
            let ua = navigator.userAgent;
            if (ua.includes("Mobile") || ua.includes("Android") || ua.includes("iPhone")) {
                return "Mobile Phone (" + navigator.platform + ")";
            }
            return "Desktop PC/Laptop (" + navigator.platform + ")";
        }

        // 🚀 Auto Login Check (যদি এপ্রুভড থাকে, সরাসরি ড্যাশবোর্ডে যাবে)
        window.onload = function() {
            if (localStorage.getItem('is_logged_in') === 'true') {
                window.location.href = '/bot.html';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const msgBox = document.getElementById('msgBox');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const d_id = getDeviceId();
            const d_name = getDeviceName();

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p, device_id: d_id, device_name: d_name })
            })
            .then(res => res.json())
            .then(data => {
                msgBox.classList.remove('hidden', 'bg-red-900/50', 'text-red-400', 'border-red-500', 'bg-yellow-900/50', 'text-yellow-400', 'border-yellow-500');
                
                if (data.status === 'success') {
                    localStorage.setItem('is_logged_in', 'true');
                    window.location.href = '/bot.html';
                } else if (data.status === 'pending') {
                    msgBox.classList.add('bg-yellow-900/50', 'text-yellow-400', 'border-yellow-500');
                    msgBox.innerText = data.message;
                    btn.innerText = "Check Approval & Login";
                    btn.disabled = false;
                } else {
                    msgBox.classList.add('bg-red-900/50', 'text-red-400', 'border-red-500');
                    msgBox.innerText = data.message;
                    btn.innerText = "Login to Dashboard";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                msgBox.classList.remove('hidden');
                msgBox.innerText = "Server error!";
                btn.innerText = "Login to Dashboard";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
