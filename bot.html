<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Shoter Premium AI Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass-panel { background: #161b22; border: 1px solid #30363d; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .ai-dot { animation: pulse-dot 1.5s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- হেডার -->
    <header class="w-full max-w-md flex items-center justify-between py-4 border-b border-gray-800 mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-md flex justify-center items-center font-bold text-black lg shadow-yellow-500/30">B</div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white">Black Shoter AI</h1>
                <p class="text-xs text-yellow-500 font-semibold">VIP Dashboard</p>
            </div>
        </div>
        <button onclick="window.location.href='/login.html'" class="text-red-400 hover:text-red-300 text-sm font-semibold">Logout</button>
    </header>

    <!-- এআই স্ট্যাটাস -->
    <div class="w-full max-w-md glass-panel rounded-xl p-4 mb-6">
        <div class="text-xs text-blue-400 font-bold mb-1 tracking-wider uppercase">AI System Active</div>
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-green-500 rounded-full ai-dot"></div>
            <h2 class="text-lg font-bold">Auto Analysis is Running</h2>
        </div>
        <p id="ai-message" class="text-sm text-gray-400 mt-1">AI is scanning the market...</p>
    </div>

    <!-- সিগন্যাল কার্ড -->
    <div class="w-full max-w-md">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-gray-300">Live Signal</h3>
            <span id="current-time" class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">Loading Time...</span>
        </div>

        <div class="glass-panel rounded-xl p-5 relative overflow-hidden border-t-2 border-t-yellow-500">
            <!-- সিগন্যালের নাম ও অ্যাকশন -->
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 id="signal-asset" class="text-2xl font-extrabold tracking-wider text-white">SCANNING...</h2>
                    <p id="signal-type" class="text-xs text-yellow-500 font-bold mt-1">Please Wait</p>
                </div>
                <div id="signal-action" class="bg-gray-800 text-gray-400 px-4 py-1.5 rounded-lg font-bold text-lg border border-gray-700">
                    --
                </div>
            </div>

            <!-- সিগন্যালের বিস্তারিত (TP/SL) -->
            <div id="signal-details" class="space-y-3 bg-[#0d1117] rounded-lg p-4 border border-gray-800">
                <p class="text-center text-sm text-gray-500">Waiting for AI confirmation...</p>
            </div>
            
            <div class="mt-4 text-center">
                <button onclick="fetchSignal()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-2 rounded-lg transition text-sm shadow-lg shadow-blue-500/20">
                    Refresh Signal
                </button>
            </div>
        </div>
    </div>

    <!-- এই জাভাস্ক্রিপ্টটি আপনার পাইথন ব্যাকএন্ড থেকে ডেটা নিয়ে আসবে -->
    <script>
        // লাইভ ঘড়ি
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // পাইথন থেকে সিগন্যাল আনার ফাংশন
        function fetchSignal() {
            fetch('/api/get_signal')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('signal-asset').innerText = data.asset;
                    document.getElementById('signal-type').innerText = data.type + " SIGNAL";
                    document.getElementById('signal-action').innerText = data.action;
                    
                    // BUY/SELL অনুযায়ী রঙ পরিবর্তন
                    if(data.action.includes("BUY") || data.action.includes("UP")) {
                        document.getElementById('signal-action').className = "bg-green-500/20 text-green-400 px-4 py-1.5 rounded-lg font-bold text-lg border border-green-500/30";
                    } else {
                        document.getElementById('signal-action').className = "bg-red-500/20 text-red-400 px-4 py-1.5 rounded-lg font-bold text-lg border border-red-500/30";
                    }

                    document.getElementById('ai-message').innerText = data.message;

                    const detailsBox = document.getElementById('signal-details');
                    if (data.type === "FOREX") {
                        detailsBox.innerHTML = `
                            <div class="flex justify-between border-b border-gray-800 pb-2">
                                <span class="text-gray-400 font-semibold text-sm">ENTRY:</span>
                                <span class="font-bold text-white">${data.entry}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-800 pb-2">
                                <span class="text-green-400 font-semibold text-sm">TP 1:</span>
                                <span class="font-bold text-white">${data.tp1}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-800 pb-2">
                                <span class="text-green-500 font-semibold text-sm">TP 2:</span>
                                <span class="font-bold text-white">${data.tp2}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-red-400 font-semibold text-sm">SL:</span>
                                <span class="font-bold text-white">${data.sl}</span>
                            </div>
                        `;
                    } else {
                        detailsBox.innerHTML = `
                            <div class="flex justify-between border-b border-gray-800 pb-2">
                                <span class="text-gray-400 font-semibold text-sm">TIMEFRAME:</span>
                                <span class="font-bold text-white">${data.timeframe}</span>
                            </div>
                            <div class="flex justify-between border-b border-gray-800 pb-2">
                                <span class="text-yellow-400 font-semibold text-sm">PAYOUT:</span>
                                <span class="font-bold text-white">${data.payout}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-blue-400 font-semibold text-sm">STATUS:</span>
                                <span class="font-bold text-green-400">${data.status}</span>
                            </div>
                        `;
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // পেজ ওপেন হওয়ার সাথে সাথেই সিগন্যাল খুঁজবে
        fetchSignal();
        
        // প্রতি ৩০ সেকেন্ড পর পর অটোমেটিক নতুন সিগন্যাল আপডেট হবে
        setInterval(fetchSignal, 30000);
    </script>
</body>
</html>
