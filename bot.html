<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Shoter AI - VIP Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-white font-sans min-h-screen p-4">
    
    <!-- 🔊 প্রিমিয়াম অ্যালার্ট সাউন্ড -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-500 rounded-lg flex items-center justify-center font-bold text-black text-xl">B</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Black Shoter AI</h1>
                    <p class="text-xs text-yellow-500">VIP Dashboard</p>
                </div>
            </div>
            <a href="/" class="text-red-400 text-sm font-semibold hover:text-red-300">Logout</a>
        </div>

        <!-- AI Status -->
        <div class="bg-[#161b22] border border-gray-800 rounded-xl p-4 mb-6">
            <p class="text-xs text-blue-400 font-bold mb-1">AI SYSTEM ACTIVE</p>
            <div class="flex items-center gap-2 mb-2">
                <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
                <h2 class="font-bold text-lg">Auto Analysis is Running</h2>
            </div>
            <p id="ai-message" class="text-sm text-gray-400">মার্কেট স্ক্যান করা হচ্ছে...</p>
        </div>

        <!-- Signal Card -->
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold">Live Signal</h3>
            <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400" id="currentTime">--:--:--</span>
        </div>

        <div class="bg-[#161b22] border border-yellow-600/30 rounded-xl p-5 shadow-[0_0_15px_rgba(234,179,8,0.1)] relative overflow-hidden mb-6">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-600 to-yellow-400"></div>

            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="asset-name" class="text-2xl font-extrabold uppercase tracking-wider mb-1">SCANNING...</h2>
                    <p id="signal-type" class="text-xs text-yellow-500 font-bold">WAITING SIGNAL</p>
                </div>
                <div id="action-badge" class="px-3 py-1.5 bg-gray-800 text-gray-300 rounded font-bold text-sm border border-gray-700 transition-all duration-300">
                    WAIT ⏳
                </div>
            </div>

            <div class="space-y-4 border border-gray-800 rounded-lg p-4 bg-[#0d1117] mb-6" id="signal-details">
                <!-- Data will show here -->
            </div>

            <button onclick="fetchSignal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-900/20 tracking-wide">
                Refresh Signal
            </button>
        </div>

        <!-- History Section -->
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold">Today's Trade History</h3>
        </div>
        <div class="bg-[#161b22] border border-gray-800 rounded-xl p-4 mb-8">
            <div id="history-list" class="space-y-3">
                <p class="text-sm text-gray-500 text-center py-2">No history yet.</p>
            </div>
        </div>
    </div>

    <!-- AI Logic Script -->
    <script>
        let lastAction = "WAIT ⏳";

        function updateTime() {
            document.getElementById('currentTime').innerText = new Date().toLocaleTimeString();
        }
        setInterval(updateTime, 1000);

        // মোবাইলে নোটিফিকেশন পারমিশন চাওয়া
        document.addEventListener('DOMContentLoaded', () => {
            if (Notification.permission !== "denied" && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        });

        function fetchSignal() {
            fetch('/api/get_signal')
                .then(res => res.json())
                .then(data => {
                    // Update AI Message & Headers
                    document.getElementById('ai-message').innerText = data.message;
                    document.getElementById('asset-name').innerText = data.asset;
                    document.getElementById('signal-type').innerText = data.type ? (data.type + " SIGNAL") : "WAITING SIGNAL";
                    
                    const badge = document.getElementById('action-badge');
                    badge.innerText = data.action;
                    
                    if(data.action.includes("BUY") || data.action.includes("UP")) {
                        badge.className = "px-3 py-1.5 bg-green-900/80 text-green-400 rounded font-bold text-sm border border-green-500 animate-pulse";
                    } else if(data.action.includes("SELL") || data.action.includes("DOWN")) {
                        badge.className = "px-3 py-1.5 bg-red-900/80 text-red-400 rounded font-bold text-sm border border-red-500 animate-pulse";
                    } else {
                        badge.className = "px-3 py-1.5 bg-gray-800 text-gray-300 rounded font-bold text-sm border border-gray-700";
                    }

                    // 🔊 সাউন্ড এবং পুশ নোটিফিকেশন লজিক
                    if (data.action !== "WAIT ⏳" && lastAction === "WAIT ⏳") {
                        document.getElementById('alertSound').play().catch(e => console.log("Audio play blocked by browser"));
                        
                        // মোবাইলে ব্যাকগ্রাউন্ড নোটিফিকেশন
                        if (Notification.permission === "granted") {
                            new Notification("🔥 VIP Signal Alert!", { 
                                body: `${data.asset} - ${data.action} Signal is Live!\nEntry: ${data.entry || "--"}`,
                                icon: "https://cdn-icons-png.flaticon.com/512/2950/2950150.png"
                            });
                        }
                    }
                    lastAction = data.action;

                    // Update Signal Details
                    const detailsBox = document.getElementById('signal-details');
                    if(data.type === "FOREX") {
                        detailsBox.innerHTML = `
                            <div class="flex justify-between items-center"><span class="text-xs text-gray-400 font-bold">ENTRY:</span><span class="font-bold text-white">${data.entry}</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-green-500 font-bold">TP 1:</span><span class="font-bold text-green-400">${data.tp1}</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-green-500 font-bold">TP 2:</span><span class="font-bold text-green-400">${data.tp2}</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-red-500 font-bold">SL:</span><span class="font-bold text-red-400">${data.sl}</span></div>
                        `;
                    } else if (data.type === "BINARY") {
                        detailsBox.innerHTML = `
                            <div class="flex justify-between items-center"><span class="text-xs text-gray-400 font-bold">TIMEFRAME:</span><span class="font-bold text-white">${data.timeframe}</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-gray-400 font-bold">PAYOUT:</span><span class="font-bold text-white">${data.payout}</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-blue-400 font-bold">STATUS:</span><span class="font-bold text-blue-400">${data.status}</span></div>
                        `;
                    } else {
                        detailsBox.innerHTML = `
                            <div class="flex justify-between items-center"><span class="text-xs text-gray-400 font-bold">TIMEFRAME:</span><span class="font-bold text-gray-500">--</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-gray-400 font-bold">PAYOUT:</span><span class="font-bold text-gray-500">--</span></div>
                            <hr class="border-gray-800">
                            <div class="flex justify-between items-center"><span class="text-xs text-blue-400 font-bold">STATUS:</span><span class="font-bold text-gray-500">Connecting...</span></div>
                        `;
                    }

                    // 📊 Update History List
                    const historyList = document.getElementById('history-list');
                    if(data.history && data.history.length > 0) {
                        historyList.innerHTML = "";
                        data.history.forEach(trade => {
                            let resultColor = "text-gray-400";
                            if(trade.result.includes("WIN")) resultColor = "text-green-400";
                            if(trade.result.includes("LOSS")) resultColor = "text-red-400";
                            if(trade.result.includes("Running")) resultColor = "text-yellow-400";
                            
                            historyList.innerHTML += `
                                <div class="flex justify-between items-center bg-[#0d1117] p-3 rounded-lg border border-gray-800">
                                    <div>
                                        <p class="text-xs text-gray-500">${trade.time}</p>
                                        <p class="font-bold text-sm">${trade.asset} <span class="text-xs ${trade.action.includes('BUY') ? 'text-green-500' : 'text-red-500'}">${trade.action}</span></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="font-bold text-sm ${resultColor}">${trade.result}</p>
                                        <p class="text-xs text-gray-500">Entry: ${trade.entry}</p>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        historyList.innerHTML = '<p class="text-sm text-gray-500 text-center py-2">No history yet.</p>';
                    }
                })
                .catch(err => console.log(err));
        }

        // অটো রিফ্রেশ (প্রতি ৩০ সেকেন্ড পর পর)
        fetchSignal();
        setInterval(fetchSignal, 30000);
    </script>
</body>
</html>
